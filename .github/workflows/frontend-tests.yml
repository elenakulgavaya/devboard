name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    paths: ["frontend/**", "tests/contracts/**"]
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Start mock environment
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for MockServer
        run: timeout 60 bash -c 'until curl -sf -X PUT http://localhost:8080/mockserver/status; do sleep 2; done'

      - name: Wait for frontend
        run: timeout 30 bash -c 'until curl -sf http://localhost:3010; do sleep 1; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/contracts/requirements/ui.txt

      - name: Install dependencies
        run: pip install -r tests/contracts/requirements/ui.txt

      - name: Run frontend tests
        working-directory: tests/contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest frontend/ \
            --html report.html \
            --self-contained-html \
            -v

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: tests/contracts/report.html
          retention-days: 14

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-screenshots
          path: tests/contracts/screenshots/
          retention-days: 14
