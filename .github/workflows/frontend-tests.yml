name: Frontend Tests

on:
  push:
    branches: [main]
  pull_request:
    paths: ["frontend/**"]
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Start mock environment
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for MockServer
        run: timeout 60 bash -c 'until curl -sf -X PUT http://localhost:8080/mockserver/status; do sleep 2; done'

      - name: Wait for frontend
        run: timeout 30 bash -c 'until curl -sf http://localhost:3010; do sleep 1; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/frontend/requirements.txt

      - name: Install dependencies
        run: pip install -r tests/frontend/requirements.txt

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('tests/frontend/requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run frontend tests
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest frontend/ \
            --browser chromium \
            --screenshot only-on-failure \
            --video retain-on-failure \
            --tracing retain-on-failure \
            --output frontend-playwright-output \
            --html frontend-report.html \
            --self-contained-html \
            -v

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-report
          path: tests/frontend-report.html
          retention-days: 14

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-output
          path: tests/frontend-playwright-output/
          retention-days: 14
