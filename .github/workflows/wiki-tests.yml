name: Wiki Tests

on:
  push:
    branches: [main]
  pull_request:
    paths: ["services/wiki/**", "tests/contracts/wiki/**", "tests/contracts/utils/**", "docker-compose.wiki-test.yml"]
  workflow_dispatch:

jobs:
  wiki-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Start test environment
        run: docker compose -f docker-compose.yml -f docker-compose.wiki-test.yml up wiki mockserver -d --build

      - name: Wait for MockServer
        run: timeout 60 bash -c 'until curl -sf -X PUT http://localhost:8080/mockserver/status; do sleep 2; done'

      - name: Wait for wiki service
        run: timeout 60 bash -c 'until curl -sf http://localhost:8002/health; do sleep 2; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/contracts/requirements/wiki.txt

      - name: Install dependencies
        run: pip install -r tests/contracts/requirements/wiki.txt

      - name: Run wiki tests
        working-directory: tests/contracts
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest wiki/ \
            --html report.html \
            --self-contained-html \
            -v

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.wiki-test.yml down

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-test-report
          path: tests/contracts/report.html
          retention-days: 14
