name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # daily at 06:00 UTC to catch backend regressions
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install Python dependencies
        run: pip install -r tests/e2e/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run E2E tests
        env:
          DEVBOARD_URL: https://qaexplained.com/devboard/
          DEVBOARD_USER: admin
          DEVBOARD_PASS: ${{ secrets.DEVBOARD_PASS }}
        run: |
          pytest tests/e2e/ \
            --browser chromium \
            --screenshot only-on-failure \
            --video retain-on-failure \
            --tracing retain-on-failure \
            --output tests/e2e/playwright-output \
            --html tests/e2e/report.html \
            --self-contained-html \
            -v

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            tests/e2e/report.html
            tests/e2e/playwright-output/
          retention-days: 14
