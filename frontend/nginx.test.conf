server {
    listen 80;
    root /usr/share/nginx/html;

    location = /config.js {
        default_type application/javascript;
        return 200 'window.DEVBOARD_TASKS_URL = "http://localhost:3010/mockserver";\nwindow.DEVBOARD_WIKI_URL  = "http://localhost:3010/mockserver";\n';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /mockserver/ {
        proxy_pass http://mockserver:1080/mockserver/;
        proxy_set_header Host $host;
    }
}
