services:
  mockserver:
    image: mockserver/mockserver:latest
    ports:
      - "8080:1080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:1080/mockserver/status || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  frontend:
    image: nginx:alpine
    ports:
      - "3010:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mockserver:
        condition: service_healthy
