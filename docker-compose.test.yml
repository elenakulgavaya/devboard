services:
  mockserver:
    image: mockserver/mockserver:latest
    ports:
      - "8080:1080"

  frontend:
    image: nginx:alpine
    ports:
      - "3010:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/config.test.js:/usr/share/nginx/html/config.js:ro
    depends_on:
      mockserver:
        condition: service_started
